<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="reset.css">
  <link rel="stylesheet" type="text/css" href="style.css">
  <title>Frontend Mentor | Job Listings</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body class="bg-white">
  <div class="root relative">
    <header class="bg-header top-0 h-39 bg-green-400 absolute w-full "></header>
    <div class="relative z-10 flex flex-col items-center ">
      <div class="gap-0 mt-40 w-full flex flex-col">
        <div id="jobsActiveFilters" class="container -translate-y-10 shadow-xl md:w-[clamp(720px,90vw,780px)] lg:w-[clamp(970px,80vw,1280px)] bg-white rounded-lg transition-all duration-100 ease-in-out flex flex-row items-center h-auto w-[clamp(336px,100%,360px)] mx-auto py-4 px-6 box-border justify-between">
          <div class="filters flex flex-wrap gap-2"></div>
          <span class="text-gray-500 clearButton font-bold cursor-pointer hover:text-green-400 transition-text duration-100">Clear</span>
        </div>

        <div id="jobs" class="mt-10 grid grid-cols-1 md:grid-cols-2 gap-[clamp(1.5rem,8vw,3rem)] mb-6 transition-all place-items-center duration-200 ease-out md:gap-[clamp(1.5rem,4vw,3rem)] md:mx-auto md:w-[clamp(720px,90vw,780px)] px-4 md:px-0 lg:flex lg:flex-col lg:w-[clamp(970px,80vw,1280px)]"></div>

      </div>
    </div>
  </div>
  
  
  <!-- <div><footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
  </div> -->
  <script src="script.js"></script>
</body>
</html>
